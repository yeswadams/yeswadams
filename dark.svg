<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark mode gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1">
        <animate attributeName="offset" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1">
        <animate attributeName="offset" values="50%;150%;50%" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1">
        <animate attributeName="offset" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="bgGlow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="bgGlow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#6D28D9;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="bgGlow3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0369A1;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>

    <!-- Glassmorphism blur filter -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for ASCII -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="1" />
    </filter>

    <!-- Border shimmer mask -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>

    <!-- Scanline animation -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="#030712"/>

  <!-- Floating background glows -->
  <ellipse cx="200" cy="150" rx="400" ry="300" fill="url(#bgGlow1)">
    <animate attributeName="cx" values="200;250;200" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="150;200;150" dur="18s" repeatCount="indefinite" />
  </ellipse>

  <ellipse cx="1000" cy="450" rx="350" ry="320" fill="url(#bgGlow2)">
    <animate attributeName="cx" values="1000;950;1000" dur="20s" repeatCount="indefinite" />
    <animate attributeName="cy" values="450;400;450" dur="22s" repeatCount="indefinite" />
  </ellipse>

  <ellipse cx="590" cy="305" rx="600" ry="400" fill="url(#bgGlow3)">
    <animate attributeName="rx" values="600;650;600" dur="25s" repeatCount="indefinite" />
    <animate attributeName="ry" values="400;420;400" dur="28s" repeatCount="indefinite" />
  </ellipse>

  <!-- Noise overlay -->
  <rect width="1180" height="610" fill="#FFFFFF" opacity="0.02" />

  <!-- Main container with glassmorphism -->
  <g>
    <!-- Background blur effect base -->
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="#0F172A" opacity="0.5" filter="url(#blur)"/>
    
    <!-- Glass border -->
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Border shimmer -->
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="none" stroke="url(#shimmer)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,2200;2200,0" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Scanline effect -->
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="url(#scanline)">
      <animate attributeName="y" values="30;640;30" dur="8s" repeatCount="indefinite" />
    </rect>

    <!-- LEFT SECTION: ASCII Art (38%) -->
    <g transform="translate(60, 50)">
      <!-- ASCII Container background -->
      <rect x="0" y="0" width="380" height="510" rx="12" fill="#030712" opacity="0.6"/>
      <rect x="0" y="0" width="380" height="510" rx="12" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

      <!-- ASCII Art with animation -->
      <g filter="url(#strongGlow)">
        <!-- Float animation -->
        <g>
          <animate attributeName="transform" values="translate(0,0);translate(0,-3);translate(0,0)" dur="4s" repeatCount="indefinite" />
          
          <!-- ASCII Lines with sequential reveal -->
          <text x="20" y="40" font-family="'Courier New', monospace" font-size="10" fill="url(#asciiGrad)" opacity="0" letter-spacing="2">
            ╔═══════════════════╗
            <animate attributeName="opacity" values="0;1;1;1" dur="6s" begin="0s" />
          </text>

          <text x="20" y="60" font-family="'Courier New', monospace" font-size="10" fill="url(#asciiGrad)" opacity="0" letter-spacing="2">
            ║   A D A M S     ║
            <animate attributeName="opacity" values="0;1;1;1" dur="6s" begin="0.4s" />
          </text>

          <text x="20" y="80" font-family="'Courier New', monospace" font-size="10" fill="url(#asciiGrad)" opacity="0" letter-spacing="2">
            ╚═══════════════════╝
            <animate attributeName="opacity" values="0;1;1;1" dur="6s" begin="0.8s" />
          </text>

          <text x="20" y="110" font-family="'Courier New', monospace" font-size="9" fill="#06B6D4" opacity="0.6">
            &lt; /dev/engineer &gt;
            <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="2s" />
          </text>

          <text x="20" y="150" font-family="'Courier New', monospace" font-size="9" fill="url(#asciiGrad)" opacity="0">
            ██╗   ██╗
            <animate attributeName="opacity" values="0;1;1" dur="6s" begin="1.2s" />
          </text>

          <text x="20" y="168" font-family="'Courier New', monospace" font-size="9" fill="url(#asciiGrad)" opacity="0">
            ██║   ██║
            <animate attributeName="opacity" values="0;1;1" dur="6s" begin="1.4s" />
          </text>

          <text x="20" y="186" font-family="'Courier New', monospace" font-size="9" fill="url(#asciiGrad)" opacity="0">
            ╚██╗ ██╔╝
            <animate attributeName="opacity" values="0;1;1" dur="6s" begin="1.6s" />
          </text>

          <text x="20" y="204" font-family="'Courier New', monospace" font-size="9" fill="url(#asciiGrad)" opacity="0">
             ╚████╔╝
            <animate attributeName="opacity" values="0;1;1" dur="6s" begin="1.8s" />
          </text>

          <text x="20" y="222" font-family="'Courier New', monospace" font-size="9" fill="url(#asciiGrad)" opacity="0">
              ╚═╝
            <animate attributeName="opacity" values="0;1;1" dur="6s" begin="2s" />
          </text>

          <!-- Cursor blink -->
          <rect x="90" y="228" width="8" height="14" fill="#06B6D4" opacity="1">
            <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" begin="2.4s" />
          </rect>

          <!-- Status lines -->
          <text x="20" y="280" font-family="'Courier New', monospace" font-size="8" fill="#94A3B8" opacity="0.7">
            $ status: active
          </text>

          <text x="20" y="300" font-family="'Courier New', monospace" font-size="8" fill="#94A3B8" opacity="0.7">
            $ location: Nairobi
          </text>

          <text x="20" y="320" font-family="'Courier New', monospace" font-size="8" fill="#94A3B8" opacity="0.7">
            $ focus: Web3
          </text>

          <text x="20" y="360" font-family="'Courier New', monospace" font-size="9" fill="#10B981" opacity="0.8">
            ✓ Ready to connect
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" begin="3s" />
          </text>
        </g>
      </g>
    </g>

    <!-- RIGHT SECTION: Terminal Content (62%) -->
    <g transform="translate(480, 50)">
      <!-- Terminal window background -->
      <rect x="0" y="0" width="640" height="510" rx="12" fill="#0F172A" opacity="0.4" filter="url(#blur)"/>
      <rect x="0" y="0" width="640" height="510" rx="12" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>

      <!-- Terminal header -->
      <rect x="0" y="0" width="640" height="40" rx="12" rx="12" fill="rgba(15,23,42,0.8)"/>
      <circle cx="20" cy="20" r="4" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="4" fill="#FBBF24" opacity="0.8"/>
      <circle cx="60" cy="20" r="4" fill="#10B981" opacity="0.8"/>
      <text x="280" y="26" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
        ~ Terminal
      </text>

      <!-- Terminal content -->
      <g transform="translate(25, 65)">
        <!-- Greeting -->
        <text x="0" y="0" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#F8FAFC">
          Hi 👋
          <animate attributeName="opacity" values="0;1;1" dur="1s" />
        </text>

        <!-- Name with typing effect -->
        <text x="0" y="45" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="url(#accentGrad)">
          I'm Adams
          <animate attributeName="opacity" values="0;1;1" dur="1.5s" begin="0.5s" />
        </text>

        <!-- Typing cursor after name -->
        <rect x="245" y="30" width="3" height="24" fill="#7C3AED" opacity="1">
          <animate attributeName="opacity" values="1;1;0;0" dur="0.8s" repeatCount="indefinite" begin="2s" />
        </rect>

        <!-- Divider -->
        <line x1="0" y1="70" x2="590" y2="70" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

        <!-- Role -->
        <text x="0" y="105" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Role:
        </text>
        <text x="100" y="105" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" opacity="0">
          Software Engineer
          <animate attributeName="opacity" values="0;1;1" dur="1s" begin="0.8s" />
        </text>

        <!-- Location -->
        <text x="0" y="135" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Location:
        </text>
        <text x="130" y="135" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" opacity="0">
          Nairobi, Kenya 🇰🇪
          <animate attributeName="opacity" values="0;1;1" dur="1s" begin="1.3s" />
        </text>

        <!-- Focus -->
        <text x="0" y="165" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Focus:
        </text>
        <text x="90" y="165" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" opacity="0">
          Frontend • Web3 • UX
          <animate attributeName="opacity" values="0;1;1" dur="1s" begin="1.8s" />
        </text>

        <!-- Skills divider -->
        <line x1="0" y1="195" x2="590" y2="195" stroke="rgba(6,182,212,0.2)" stroke-width="1" opacity="0">
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="2.3s" />
        </line>

        <!-- Skills section -->
        <text x="0" y="225" font-family="'Courier New', monospace" font-size="12" fill="#10B981" opacity="0">
          $ skills --list
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="2.5s" />
        </text>

        <!-- Skill pills -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="3s" />

          <!-- Pill 1: React -->
          <rect x="0" y="250" width="70" height="28" rx="14" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
          <text x="35" y="270" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle">
            React
          </text>

          <!-- Pill 2: Next.js -->
          <rect x="85" y="250" width="80" height="28" rx="14" fill="none" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
          <text x="125" y="270" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle">
            Next.js
          </text>

          <!-- Pill 3: TypeScript -->
          <rect x="180" y="250" width="95" height="28" rx="14" fill="none" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
          <text x="227.5" y="270" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle">
            TypeScript
          </text>

          <!-- Pill 4: Node.js -->
          <rect x="290" y="250" width="80" height="28" rx="14" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
          <text x="330" y="270" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle">
            Node.js
          </text>

          <!-- Pill 5: Rust -->
          <rect x="385" y="250" width="70" height="28" rx="14" fill="none" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
          <text x="420" y="270" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle">
            Rust
          </text>

          <!-- Pill 6: Python -->
          <rect x="470" y="250" width="75" height="28" rx="14" fill="none" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
          <text x="507.5" y="270" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle">
            Python
          </text>

          <!-- Row 2: Pill 7 -->
          <rect x="0" y="295" width="80" height="28" rx="14" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
          <text x="40" y="315" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle">
            Tailwind
          </text>

          <!-- Pill 8 -->
          <rect x="95" y="295" width="70" height="28" rx="14" fill="none" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
          <text x="130" y="315" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle">
            Docker
          </text>

          <!-- Pill 9 -->
          <rect x="180" y="295" width="70" height="28" rx="14" fill="none" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
          <text x="215" y="315" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle">
            AWS
          </text>

          <!-- Pill 10 -->
          <rect x="265" y="295" width="70" height="28" rx="14" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
          <text x="300" y="315" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle">
            Git
          </text>

          <!-- Pill 11 -->
          <rect x="350" y="295" width="80" height="28" rx="14" fill="none" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
          <text x="390" y="315" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle">
            Postgres
          </text>
        </g>

        <!-- Status line -->
        <text x="0" y="370" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8" opacity="0">
          $ open --contact
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="3.6s" />
        </text>

        <!-- Social/Contact info -->
        <text x="0" y="400" font-family="'Courier New', monospace" font-size="10" fill="#F8FAFC" opacity="0">
          📧 Email: hello@yeswadams.dev
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="4s" />
        </text>

        <text x="0" y="425" font-family="'Courier New', monospace" font-size="10" fill="#F8FAFC" opacity="0">
          🔗 Portfolio: yeswadams.dev
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="4.3s" />
        </text>

        <!-- Bottom prompt -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1" dur="0.6s" begin="4.6s" />
          <text x="0" y="460" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4">
            $ _
          </text>
          <rect x="24" y="450" width="2" height="12" fill="#06B6D4">
            <animate attributeName="opacity" values="1;1;0;0" dur="0.8s" repeatCount="indefinite" begin="4.6s" />
          </rect>
        </g>
      </g>
    </g>

    <!-- Floating particles effect -->
    <g opacity="0.15">
      <circle cx="150" cy="100" r="2" fill="#06B6D4">
        <animate attributeName="cy" values="100;50;100" dur="6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite" />
      </circle>
      <circle cx="1050" cy="500" r="1.5" fill="#7C3AED">
        <animate attributeName="cy" values="500;550;500" dur="8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite" />
      </circle>
      <circle cx="300" cy="550" r="1" fill="#10B981">
        <animate attributeName="cx" values="300;350;300" dur="7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="7s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>