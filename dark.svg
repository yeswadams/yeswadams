<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes shine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .shimmer { animation: shine 3s infinite; }
      .float { animation: float 4s ease-in-out infinite; }
    </style>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="bgGlow1">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="bgGlow2">
      <stop offset="0%" style="stop-color:#6D28D9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="#030712"/>

  <!-- Subtle glows -->
  <ellipse cx="200" cy="150" rx="400" ry="300" fill="url(#bgGlow1)" opacity="0.5"/>
  <ellipse cx="1000" cy="450" rx="350" ry="320" fill="url(#bgGlow2)" opacity="0.4"/>

  <!-- Main container -->
  <g>
    <!-- Glass panel background -->
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="#0F172A" opacity="0.6"/>
    <rect x="40" y="30" width="1100" height="550" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

    <!-- LEFT SECTION: ASCII Art -->
    <g transform="translate(60, 50)">
      <rect x="0" y="0" width="380" height="510" rx="12" fill="#030712" opacity="0.4"/>
      <rect x="0" y="0" width="380" height="510" rx="12" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>

      <!-- ASCII Art -->
      <g class="float" transform="translate(0, 0)">
        <text x="30" y="60" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06B6D4" letter-spacing="3">
          ╔═══════════════════╗
        </text>
        <text x="30" y="85" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06B6D4" letter-spacing="3">
          ║   A D A M S     ║
        </text>
        <text x="30" y="110" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06B6D4" letter-spacing="3">
          ╚═══════════════════╝
        </text>

        <text x="30" y="160" font-family="'Courier New', monospace" font-size="9" fill="#22D3EE" opacity="0.7">
          &lt; /dev/engineer &gt;
        </text>

        <!-- Y Shape ASCII -->
        <text x="50" y="210" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#7C3AED">
          ██╗   ██╗
        </text>
        <text x="50" y="232" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#7C3AED">
          ██║   ██║
        </text>
        <text x="50" y="254" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#7C3AED">
          ╚██╗ ██╔╝
        </text>
        <text x="50" y="276" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#7C3AED">
           ╚████╔╝
        </text>
        <text x="50" y="298" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#7C3AED">
             ╚═╝
        </text>

        <line x1="30" y1="340" x2="340" y2="340" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

        <text x="30" y="370" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8">
          $ status: active
        </text>
        <text x="30" y="395" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8">
          $ location: Nairobi
        </text>
        <text x="30" y="420" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8">
          $ focus: Web3
        </text>

        <text x="30" y="465" font-family="'Courier New', monospace" font-size="9" fill="#10B981" font-weight="bold">
          ✓ Ready to build
        </text>
      </g>
    </g>

    <!-- RIGHT SECTION: Terminal -->
    <g transform="translate(480, 50)">
      <rect x="0" y="0" width="640" height="510" rx="12" fill="#0F172A" opacity="0.3"/>
      <rect x="0" y="0" width="640" height="510" rx="12" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="1.5"/>

      <!-- Terminal header -->
      <rect x="0" y="0" width="640" height="45" rx="12" fill="rgba(15,23,42,0.9)"/>
      <circle cx="25" cy="22" r="5" fill="#EF4444" opacity="0.9"/>
      <circle cx="50" cy="22" r="5" fill="#FBBF24" opacity="0.9"/>
      <circle cx="75" cy="22" r="5" fill="#10B981" opacity="0.9"/>
      <text x="320" y="30" font-family="'Courier New', monospace" font-size="13" fill="#94A3B8" text-anchor="middle" font-weight="bold">
        ~ profile.sh
      </text>

      <!-- Content -->
      <g transform="translate(30, 70)">
        <text x="0" y="0" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#F8FAFC">
          Hi 👋
        </text>
        <text x="0" y="40" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="url(#accentGrad)">
          I'm Adams
        </text>

        <line x1="0" y1="65" x2="580" y2="65" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

        <text x="0" y="100" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Role:
        </text>
        <text x="120" y="100" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" font-weight="500">
          Software Engineer
        </text>

        <text x="0" y="130" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Location:
        </text>
        <text x="160" y="130" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" font-weight="500">
          Nairobi 🇰🇪
        </text>

        <text x="0" y="160" font-family="'Courier New', monospace" font-size="14" fill="#94A3B8">
          → Focus:
        </text>
        <text x="100" y="160" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" font-weight="500">
          Frontend • Web3 • UX
        </text>

        <line x1="0" y1="185" x2="580" y2="185" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

        <text x="0" y="220" font-family="'Courier New', monospace" font-size="12" fill="#10B981" font-weight="bold">
          $ skills --installed
        </text>

        <!-- Skills Row 1 -->
        <g transform="translate(0, 245)">
          <rect x="0" y="0" width="75" height="32" rx="16" fill="none" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
          <text x="37.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">React</text>

          <rect x="90" y="0" width="85" height="32" rx="16" fill="none" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
          <text x="132.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="bold">Next.js</text>

          <rect x="190" y="0" width="105" height="32" rx="16" fill="none" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
          <text x="242.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle" font-weight="bold">TypeScript</text>

          <rect x="310" y="0" width="80" height="32" rx="16" fill="none" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
          <text x="350" y="22" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">Node.js</text>
        </g>

        <!-- Skills Row 2 -->
        <g transform="translate(0, 290)">
          <rect x="0" y="0" width="75" height="32" rx="16" fill="none" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
          <text x="37.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="bold">Rust</text>

          <rect x="90" y="0" width="85" height="32" rx="16" fill="none" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
          <text x="132.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#10B981" text-anchor="middle" font-weight="bold">Python</text>

          <rect x="190" y="0" width="85" height="32" rx="16" fill="none" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
          <text x="232.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4" text-anchor="middle" font-weight="bold">Docker</text>

          <rect x="290" y="0" width="75" height="32" rx="16" fill="none" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
          <text x="327.5" y="22" font-family="'Courier New', monospace" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="bold">AWS</text>
        </g>

        <line x1="0" y1="340" x2="580" y2="340" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>

        <text x="0" y="375" font-family="'Courier New', monospace" font-size="12" fill="#06B6D4">
          $ cat contact.txt
        </text>

        <text x="0" y="405" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          📧 hello@yeswadams.dev
        </text>

        <text x="0" y="435" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          🌐 yeswadams.dev
        </text>

        <text x="0" y="475" font-family="'Courier New', monospace" font-size="11" fill="#06B6D4">
          $ _
        </text>
      </g>
    </g>
  </g>

  <!-- Shimmer overlay (top border) -->
  <g class="shimmer" opacity="0.3">
    <rect x="40" y="30" width="200" height="550" rx="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>
</svg>